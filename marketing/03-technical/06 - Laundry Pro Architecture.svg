<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 690" width="100%" height="100%">
  <!-- Definitions for gradients, styles, and shadow filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94A3B8" />
    </marker>
    
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8" />
    </marker>

    <marker id="arrow-gold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FBBF24" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="690" rx="16" fill="url(#bg-gradient)" stroke="#334155" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(40, 40)">
    <rect width="18" height="6" rx="3" fill="#38BDF8" />
    <text x="28" y="7" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#F8FAFC" letter-spacing="1">
      LAUNDRAPRO UAE <tspan fill="#38BDF8" font-size="11" font-weight="600">· SYSTEM ARCHITECTURE MAP</tspan>
    </text>
  </g>

  <!-- PRESENTATION TIER (Flutter Desktop) -->
  <g filter="url(#shadow)">
    <rect x="150" y="75" width="500" height="85" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
    <!-- Window dot controls -->
    <circle cx="170" cy="93" r="4.5" fill="#EF4444" />
    <circle cx="182" cy="93" r="4.5" fill="#FBBF24" />
    <circle cx="194" cy="93" r="4.5" fill="#22C55E" />
    
    <!-- Title and details inside -->
    <text x="400" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#F8FAFC" text-anchor="middle">Flutter Windows Desktop</text>
    <text x="400" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">Presentation Tier — Views / ViewModels</text>
  </g>

  <!-- HTTP CONNECTOR (localhost) -->
  <g>
    <!-- Vertical dotted connector line -->
    <line x1="400" y1="160" x2="400" y2="235" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-blue)" />
    
    <!-- Tag overlay -->
    <rect x="230" y="178" width="340" height="30" rx="15" fill="#0F172A" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <text x="400" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="0.5">
      HTTP (localhost) — JSON / JWT
    </text>
  </g>

  <!-- APPLICATION TIER (PHP Layer) -->
  <g filter="url(#shadow)">
    <rect x="80" y="235" width="640" height="200" rx="14" fill="#1E293B" stroke="#2DD4BF" stroke-width="2" />
    <!-- Title -->
    <text x="400" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#F8FAFC" text-anchor="middle">PHP Layer (Application Tier)</text>
    
    <!-- Sub-module Group 1 (Horizontal card) -->
    <rect x="100" y="295" width="600" height="50" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <!-- Content row 1 -->
    <text x="400" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" text-anchor="middle" letter-spacing="0.5">
      Auth  <tspan fill="#475569" font-weight="normal">|</tspan>  Validation  <tspan fill="#475569" font-weight="normal">|</tspan>  Application Services  <tspan fill="#475569" font-weight="normal">|</tspan>  Audit  <tspan fill="#475569" font-weight="normal">|</tspan>  Files
    </text>

    <!-- Sub-module Group 2 (Horizontal card) -->
    <rect x="100" y="355" width="600" height="50" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <!-- Content row 2 -->
    <text x="400" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" text-anchor="middle" letter-spacing="0.5">
      Print  <tspan fill="#475569" font-weight="normal">|</tspan>  Backup  <tspan fill="#475569" font-weight="normal">|</tspan>  License  <tspan fill="#475569" font-weight="normal">|</tspan>  UMAC  <tspan fill="#475569" font-weight="normal">|</tspan>  Import  <tspan fill="#475569" font-weight="normal">|</tspan>  Export  <tspan fill="#475569" font-weight="normal">|</tspan>  Reports
    </text>
  </g>

  <!-- DATABASE CONNECTOR -->
  <g>
    <!-- Vertical connector line -->
    <line x1="400" y1="435" x2="400" y2="485" stroke="#FBBF24" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrow-gold)" />
    <!-- Connection Label -->
    <rect x="300" y="448" width="200" height="24" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <text x="400" y="464" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="0.5">
      PDO SQL Connect
    </text>
  </g>

  <!-- DATA TIER (MariaDB/MySQL) -->
  <g filter="url(#shadow)">
    <rect x="220" y="485" width="360" height="70" rx="10" fill="#1E293B" stroke="#FBBF24" stroke-width="2" />
    <text x="400" y="515" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#F8FAFC" text-anchor="middle">MariaDB / MySQL (Data Tier)</text>
    <text x="400" y="536" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">InnoDB Engine · Persistent Schema</text>
  </g>

  <!-- STORAGE CONNECTORS -->
  <g>
    <!-- Line from DB center bottom down -->
    <line x1="400" y1="555" x2="400" y2="580" stroke="#94A3B8" stroke-width="2" />
    <!-- Horizontal split line -->
    <line x1="230" y1="580" x2="570" y2="580" stroke="#94A3B8" stroke-width="2" />
    <!-- Left vertical drop to Local File Store -->
    <line x1="230" y1="580" x2="230" y2="600" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />
    <!-- Right vertical drop to Backup Store -->
    <line x1="570" y1="580" x2="570" y2="600" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)" />
  </g>

  <!-- BOTTOM STORES -->
  <!-- Local File Store -->
  <g filter="url(#shadow)">
    <rect x="120" y="600" width="220" height="60" rx="8" fill="#1E293B" stroke="#94A3B8" stroke-width="1.5" />
    <text x="230" y="625" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#F8FAFC" text-anchor="middle">Local File Store</text>
    <text x="230" y="643" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">C:\LaundryPro\ (Invoices, Images)</text>
  </g>

  <!-- Backup Store -->
  <g filter="url(#shadow)">
    <rect x="460" y="600" width="220" height="60" rx="8" fill="#1E293B" stroke="#94A3B8" stroke-width="1.5" />
    <text x="570" y="625" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#F8FAFC" text-anchor="middle">Backup Store</text>
    <text x="570" y="643" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">mysqldump SQL + ZIP Archives</text>
  </g>
</svg>