<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <!-- Definitions for gradients and filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Aqua/Blue Gradient for Icon Accents -->
    <linearGradient id="primary-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <!-- Water Wave Gradient -->
    <linearGradient id="water-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glass/Window Gradient -->
    <linearGradient id="glass-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
    
    <!-- Metallic Ring Gradient -->
    <linearGradient id="metal-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Drop Shadow Filter for Text & Icon -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Clip Path for Water inside Drum -->
    <clipPath id="drum-clip">
      <circle cx="130" cy="125" r="46" />
    </clipPath>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="250" rx="16" fill="url(#bg-gradient)" stroke="#334155" stroke-width="2" />

  <!-- Subtle Decorative Technical Grid Lines (representing desktop system) -->
  <g opacity="0.03" stroke="#FFFFFF" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="250" />
    <line x1="200" y1="0" x2="200" y2="250" />
    <line x1="350" y1="0" x2="350" y2="250" />
    <line x1="500" y1="0" x2="500" y2="250" />
    <line x1="650" y1="0" x2="650" y2="250" />
    <line x1="0" y1="62.5" x2="800" y2="62.5" />
    <line x1="0" y1="125" x2="800" y2="125" />
    <line x1="0" y1="187.5" x2="800" y2="187.5" />
  </g>\

  <!-- BACKGROUND GLOW (behind icon) -->
  <circle cx="130" cy="125" r="60" fill="#0EA5E9" opacity="0.15" filter="url(#glow)" />

  <!-- ICON GROUP -->
  <g filter="url(#drop-shadow)">
    <!-- Outer Spin Dashed Ring -->
    <circle cx="130" cy="125" r="58" fill="none" stroke="url(#primary-gradient)" stroke-width="2" stroke-dasharray="12 8" />

    <!-- Main Washing Machine / Drum Body (Rounded Square Outer) -->
    <rect x="74" y="69" width="112" height="112" rx="20" fill="#1E293B" stroke="url(#metal-gradient)" stroke-width="3" />
    
    <!-- Top Control Bar Accent -->
    <rect x="84" y="77" width="92" height="6" rx="3" fill="#334155" />
    <circle cx="92" cy="80" r="2" fill="#38BDF8" />
    <circle cx="100" cy="80" r="2" fill="#34D399" />
    <line x1="160" y1="80" x2="172" y2="80" stroke="#475569" stroke-width="2" stroke-linecap="round" />

    <!-- Chrome/Metal Bezel of Door -->
    <circle cx="130" cy="125" r="50" fill="none" stroke="url(#metal-gradient)" stroke-width="4" />

    <!-- Glass Door Backing -->
    <circle cx="130" cy="125" r="46" fill="url(#glass-gradient)" />

    <!-- Water & Laundry inside Drum (Clipped) -->
    <g clip-path="url(#drum-clip)">
      <!-- Animated-looking Water Waves -->
      <path d="M 80 130 C 100 120, 110 140, 130 130 C 150 120, 160 140, 180 130 L 180 180 L 80 180 Z" fill="url(#water-gradient)" />
      
      <!-- Folded Shirt / Garment Floating in Water -->
      <path d="M 112 112 L 148 112 L 154 126 L 144 130 L 140 120 L 130 124 L 120 120 L 116 130 L 106 126 Z" fill="#FFFFFF" opacity="0.85" />
      <path d="M 118 112 C 122 120, 138 120, 142 112" fill="none" stroke="#0EA5E9" stroke-width="1.5" stroke-linecap="round" />
      
      <!-- Secondary Water Swirl Lines -->
      <path d="M 90 145 C 110 135, 120 155, 140 145" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
      <path d="M 100 160 C 115 152, 125 168, 145 160" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
      
      <!-- Washing Bubbles -->
      <circle cx="102" cy="138" r="3" fill="#FFFFFF" opacity="0.7" />
      <circle cx="145" cy="148" r="4.5" fill="#FFFFFF" opacity="0.6" />
      <circle cx="122" cy="155" r="2.5" fill="#FFFFFF" opacity="0.8" />
      <circle cx="152" cy="135" r="3.5" fill="#FFFFFF" opacity="0.5" />
    </g>

    <!-- Glass Reflection Highlight (Diagonal shine across door) -->
    <path d="M 96 100 A 46 46 0 0 1 164 92 L 150 106 A 26 26 0 0 0 110 110 Z" fill="#FFFFFF" opacity="0.1" />

    <!-- Sparkles / High-Clean Shine Vectors -->
    <!-- Sparkle 1 (Top Right) -->
    <path d="M 184 62 L 187 71 L 196 74 L 187 77 L 184 86 L 181 77 L 172 74 L 181 71 Z" fill="#38BDF8" />
    <!-- Sparkle 2 (Lower Left) -->
    <path d="M 72 170 L 74 175 L 79 177 L 74 179 L 72 184 L 70 179 L 65 177 L 70 175 Z" fill="#34D399" />
    <!-- Sparkle 3 (Small Top Left) -->
    <path d="M 84 56 L 85 59 L 88 60 L 85 61 L 84 64 L 83 61 L 80 60 L 83 59 Z" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- TYPOGRAPHY GROUP -->
  <g filter="url(#drop-shadow)">
    <!-- Main Title -->
    <text x="220" y="105" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      LaundryPro <tspan fill="#38BDF8">UAE</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="222" y="142" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#94A3B8" letter-spacing="2">
      OFFLINE-FIRST LAUNDRY CRM · ERP · POS
    </text>
  </g>

  <!-- METADATA BADGES -->
  <g transform="translate(222, 172)">
    <!-- Badge 1: Architecture Core -->
    <g>
      <rect x="0" y="0" width="145" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <circle cx="16" cy="14" r="4.5" fill="#38BDF8" filter="url(#glow)" />
      <text x="28" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1" letter-spacing="0.5">
        LaundraCore Local
      </text>
    </g>

    <!-- Badge 2: Deployment / Region -->
    <g transform="translate(155, 0)">
      <rect x="0" y="0" width="135" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <circle cx="16" cy="14" r="4.5" fill="#34D399" filter="url(#glow)" />
      <text x="28" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1" letter-spacing="0.5">
        Dubai / UAE Ready
      </text>
    </g>

    <!-- Badge 3: Connection State -->
    <g transform="translate(300, 0)">
      <rect x="0" y="0" width="105" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <circle cx="16" cy="14" r="4.5" fill="#FBBF24" filter="url(#glow)" />
      <text x="28" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1" letter-spacing="0.5">
        100% Offline
      </text>
    </g>
  </g>
</svg>