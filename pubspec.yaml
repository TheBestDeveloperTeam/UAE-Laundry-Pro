name: laundrypro_uae
description: Laundry Pro Desktop - Local Laundry Services Management System
publish_to: 'none'
version: 1.2.1+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  http: ^1.2.2
  intl: ^0.20.2
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.2
  pdf: ^3.11.1
  sqflite_common_ffi: ^2.3.6
  path_provider: ^2.1.5
  path: ^1.9.1
  synchronized: ^3.4.0
  uuid: ^4.5.1
  crypto: ^3.0.7
  mysql1: ^0.20.0
  file_picker: ^11.0.3
  dio: ^5.11.1
  print_bluetooth_thermal: ^1.2.1
  google_fonts: ^6.2.1
  phosphor_flutter: ^2.1.0
  lottie: ^3.1.2
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  esc_pos_utils_plus: ^2.0.4
  flutter_barcode_scanner: ^2.0.0
  printing: ^5.12.0
  qr_flutter: ^4.1.0
  fl_chart: 0.69.0
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  msix: ^3.16.8

flutter:
  uses-material-design: true
  assets:
    - assets/lang/
    - assets/images/
    - assets/icons/
    - assets/images/branding/
    - assets/animations/

msix_config:
  display_name: Laundry Pro UAE
  publisher_display_name: Magnificent Solution
  identity_name: LaundryProUAE.Desktop
  msix_version: 1.2.1.4
  publisher: CN=Magnificent Solution
  install_certificate: false
  certificate_path: ""
  certificate_password: ""
  architecture: x64
  output_name: laundrypro_uae_desktop
  execution_alias: laundrypro
