<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Vignette Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#0d213f" />
      <stop offset="45%" stop-color="#09162c" />
      <stop offset="75%" stop-color="#050e1d" />
      <stop offset="100%" stop-color="#030811" />
    </radialGradient>

    <!-- Squircle Border Subtle Rim -->
    <linearGradient id="squircle-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3b68" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#0f213d" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#081426" stop-opacity="0.8" />
    </linearGradient>

    <!-- Outer Droplet Glass Dome Shading -->
    <linearGradient id="droplet-glass-body" x1="25%" y1="15%" x2="75%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16" />
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.22" />
    </linearGradient>

    <!-- Droplet Glass Bevel Rim Highlight -->
    <linearGradient id="droplet-rim-grad" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="85%" stop-color="#2dd4bf" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Streamline Gradient 1: Top Tip down the Left -->
    <linearGradient id="stream-top-left" x1="60%" y1="15%" x2="15%" y2="80%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="20%" stop-color="#5eead4" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0090d0" />
    </linearGradient>

    <!-- Streamline Gradient 2: Bottom Curve (Cyan to Aqua-Mint) -->
    <linearGradient id="stream-bottom" x1="20%" y1="75%" x2="80%" y2="75%">
      <stop offset="0%" stop-color="#0088cc" />
      <stop offset="25%" stop-color="#00b4d8" />
      <stop offset="55%" stop-color="#00e5ff" />
      <stop offset="85%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Streamline Gradient 3: Right Arcs (Teal-Mint to Emerald) -->
    <linearGradient id="stream-right" x1="80%" y1="80%" x2="55%" y2="25%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="45%" stop-color="#34d399" />
      <stop offset="80%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <!-- Central Washing Machine Drum Interior -->
    <radialGradient id="drum-bg" cx="46%" cy="42%" r="56%">
      <stop offset="0%" stop-color="#0a2344" />
      <stop offset="50%" stop-color="#06162c" />
      <stop offset="90%" stop-color="#030c1a" />
      <stop offset="100%" stop-color="#020812" />
    </radialGradient>

    <!-- Drum Agitator Hub Core -->
    <radialGradient id="hub-core-grad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#67e8f9" />
      <stop offset="75%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>

    <!-- Drum Convex Glass Glare -->
    <linearGradient id="drum-glass-glare" x1="20%" y1="20%" x2="75%" y2="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="65%" stop-color="#0284c7" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0" />
    </linearGradient>

    <!-- Star Glow -->
    <radialGradient id="star-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#facc15" stop-opacity="0.75" />
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="85%" stop-color="#b45309" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </radialGradient>

    <!-- Star Solid Body Gradient -->
    <radialGradient id="star-body" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef9c3" />
      <stop offset="65%" stop-color="#fde047" />
      <stop offset="90%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>

    <!-- Star Flares -->
    <linearGradient id="star-flare-h" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="star-flare-v" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow-cyan" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neon-glow-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="star-filter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="starBlur" />
      <feMerge>
        <feMergeNode in="starBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Drum Clip Path (Radius 120 around 512, 565) -->
    <clipPath id="drum-interior-clip">
      <circle cx="512" cy="565" r="120" />
    </clipPath>

    <!-- Droplet Clip Path for Inner Shading -->
    <clipPath id="droplet-clip">
      <path d="M 512, 178
               C 502, 188 438, 270 380, 345
               C 305, 440 236, 495 234, 580
               C 230, 735 354, 855 512, 855
               C 670, 855 794, 735 790, 580
               C 788, 495 719, 440 644, 345
               C 586, 270 522, 188 512, 178 Z" />
    </clipPath>
  </defs>

  <!-- LAYER 1: BASE APP SQUIRCLE -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bg-grad)" />
  <rect x="1" y="1" width="1022" height="1022" rx="223" ry="223" fill="none" stroke="url(#squircle-border-grad)" stroke-width="2" />

  <!-- LAYER 2: AMBIENT NEON GLOW BEHIND DROPLET -->
  <circle cx="512" cy="570" r="300" fill="#00e5ff" opacity="0.10" filter="url(#neon-glow-soft)" />
  <ellipse cx="420" cy="460" rx="180" ry="240" fill="#38bdf8" opacity="0.12" filter="url(#neon-glow-soft)" />
  <ellipse cx="600" cy="580" rx="180" ry="200" fill="#2dd4bf" opacity="0.11" filter="url(#neon-glow-soft)" />

  <!-- LAYER 3: TRANSLUCENT GLASS DROPLET SHIELD -->
  <g id="glass-droplet-container">
    <path d="M 512, 178
             C 502, 188 438, 270 380, 345
             C 305, 440 236, 495 234, 580
             C 230, 735 354, 855 512, 855
             C 670, 855 794, 735 790, 580
             C 788, 495 719, 440 644, 345
             C 586, 270 522, 188 512, 178 Z"
          fill="url(#droplet-glass-body)"
          stroke="url(#droplet-rim-grad)"
          stroke-width="7"
          stroke-linejoin="round" />

    <path d="M 512, 182
             C 503, 192 442, 272 386, 346
             C 314, 439 248, 494 246, 576
             C 245, 620 258, 665 282, 706
             C 264, 660 256, 615 258, 572
             C 260, 498 322, 446 394, 354
             C 448, 283 506, 203 512, 182 Z"
          fill="#ffffff"
          opacity="0.16" />

    <path d="M 280, 715
             C 340, 800 422, 848 512, 848
             C 602, 848 684, 800 744, 715
             C 690, 785 610, 832 512, 832
             C 414, 832 334, 785 280, 715 Z"
          fill="#000000"
          opacity="0.4" />
  </g>

  <!-- LAYER 4: WASHING MACHINE CENTER DRUM -->
  <g id="center-drum">
    <circle cx="512" cy="565" r="122" fill="url(#drum-bg)" stroke="#0b2447" stroke-width="4" />

    <g id="drum-spokes" opacity="0.55" stroke="url(#stream-bottom)" stroke-width="6" stroke-linecap="round">
      <line x1="552" y1="565" x2="626" y2="565" />
      <line x1="540" y1="593" x2="593" y2="646" />
      <line x1="512" y1="605" x2="512" y2="679" />
      <line x1="484" y1="593" x2="431" y2="646" />
      <line x1="472" y1="565" x2="398" y2="565" />
      <line x1="484" y1="537" x2="431" y2="484" />
      <line x1="512" y1="525" x2="512" y2="451" />
      <line x1="540" y1="537" x2="593" y2="484" />
    </g>

    <g clip-path="url(#drum-interior-clip)">
      <path d="M 390, 565
               A 122 122 0 0 1 565, 390
               C 545, 410 460, 485 410, 575 Z"
            fill="url(#drum-glass-glare)" />
      <path d="M 430, 640
               C 400, 580 410, 490 480, 445
               C 420, 500 415, 580 430, 640 Z"
            fill="#ffffff"
            opacity="0.08" />
    </g>

    <circle cx="512" cy="565" r="32" fill="#041224" stroke="#00e5ff" stroke-width="3" opacity="0.9" />
    <circle cx="512" cy="565" r="24" fill="url(#hub-core-grad)" filter="url(#neon-glow-cyan)" />
    <circle cx="508" cy="561" r="7" fill="#ffffff" opacity="0.75" />
  </g>

  <!-- LAYER 5: NEON TRACKS AND STREAMLINE WAVE CYCLONE -->
  <g id="neon-streamlines" filter="url(#neon-glow-cyan)">
    <!-- TRACK 1: INNER NEON RING -->
    <circle cx="512" cy="565" r="132"
            fill="none"
            stroke="url(#stream-bottom)"
            stroke-width="17"
            stroke-linecap="round" />

    <!-- TRACK 2: MIDDLE NEON RING WITH DOOR LATCH NOTCH -->
    <path d="M 398, 702
             A 186 186 0 0 0 635, 706
             A 186 186 0 0 0 695, 595
             C 670, 590 635, 578 635, 552
             C 635, 526 670, 514 695, 509
             A 186 186 0 0 0 638, 428"
          fill="none"
          stroke="url(#stream-right)"
          stroke-width="19"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <path d="M 602, 388
             A 186 186 0 0 0 540, 380"
          fill="none"
          stroke="url(#stream-top-left)"
          stroke-width="19"
          stroke-linecap="round" />

    <!-- TRACK 3: OUTER CYCLONE WAVE AND DROPLET TIP FLOW -->
    <path d="M 508, 222
             C 475, 275 395, 370 338, 465
             C 292, 542 272, 608 305, 688"
          fill="none"
          stroke="url(#stream-top-left)"
          stroke-width="21"
          stroke-linecap="round" />

    <path d="M 462, 280
             C 475, 305 478, 332 460, 348
             C 442, 362 426, 340 432, 318
             C 436, 300 452, 285 462, 280 Z"
          fill="none"
          stroke="#80fff9"
          stroke-width="5"
          opacity="0.9" />

    <path d="M 372, 755
             A 246 246 0 0 0 512, 811
             A 246 246 0 0 0 758, 565
             A 246 246 0 0 0 714, 405"
          fill="none"
          stroke="url(#stream-bottom)"
          stroke-width="21"
          stroke-linecap="round" />

    <line x1="288" y1="718" x2="424" y2="682" stroke="#061222" stroke-width="14" stroke-linecap="round" />
  </g>

  <!-- LAYER 6: SECONDARY INNER NEON ACCENTS AND CAPS -->
  <g id="crisp-cores">
    <path d="M 508, 224
             C 478, 276 400, 370 344, 465
             C 302, 538 284, 602 312, 680"
          fill="none"
          stroke="#ffffff"
          stroke-width="6"
          stroke-linecap="round"
          opacity="0.85" />

    <circle cx="512" cy="565" r="132"
            fill="none"
            stroke="#ffffff"
            stroke-width="4.5"
            stroke-linecap="round"
            opacity="0.75" />

    <path d="M 374, 755
             A 246 246 0 0 0 512, 811
             A 246 246 0 0 0 758, 565
             A 246 246 0 0 0 714, 405"
          fill="none"
          stroke="#ffffff"
          stroke-width="5.5"
          stroke-linecap="round"
          opacity="0.65" />
  </g>

  <!-- LAYER 7: RADIANT GOLDEN SPARKLE STAR -->
  <g id="golden-sparkle" transform="translate(700, 318)">
    <circle cx="0" cy="0" r="110" fill="url(#star-aura)" filter="url(#star-filter)" opacity="0.8" />

    <ellipse cx="0" cy="0" rx="95" ry="14" fill="url(#star-flare-h)" opacity="0.75" filter="url(#star-filter)" />
    <ellipse cx="0" cy="0" rx="14" ry="95" fill="url(#star-flare-v)" opacity="0.75" filter="url(#star-filter)" />

    <g transform="rotate(45)">
      <ellipse cx="0" cy="0" rx="55" ry="8" fill="url(#star-flare-h)" opacity="0.6" />
      <ellipse cx="0" cy="0" rx="8" ry="55" fill="url(#star-flare-v)" opacity="0.6" />
    </g>

    <path d="M 0, -82
             C 0, -22 22, 0 82, 0
             C 22, 0 0, 22 0, 82
             C 0, 22 -22, 0 -82, 0
             C -22, 0 0, -22 0, -82 Z"
          fill="url(#star-body)"
          filter="url(#star-filter)" />

    <g transform="rotate(45)">
      <path d="M 0, -32
               C 0, -8 8, 0 32, 0
               C 8, 0 0, 8 0, 32
               C 0, 8 -8, 0 -32, 0
               C -8, 0 0, -8 0, -32 Z"
            fill="#fde047"
            opacity="0.8" />
    </g>

    <circle cx="0" cy="0" r="10" fill="#ffffff" />
    <circle cx="0" cy="0" r="18" fill="#ffffff" opacity="0.6" filter="url(#star-filter)" />
  </g>
</svg>
