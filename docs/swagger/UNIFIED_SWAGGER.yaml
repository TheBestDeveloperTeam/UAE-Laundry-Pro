          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"
        400:
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"
        401:
          description: AUTH_SESSION_EXPIRED
          content:
            application/json:
              schema:
