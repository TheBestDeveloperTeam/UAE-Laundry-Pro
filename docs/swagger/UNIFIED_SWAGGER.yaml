openapi: 3.0.0
info:
  title: Unified Laundry Pro API (Local & Cloud)
  version: 1.0.0
paths:

# --- FROM SWAGGER_LOCAL.yaml ---
openapi: 3.0.3
info:
  title: LaundryPro UAE - Local API
  description: Offline-first local micro-services API documentation for LaundryPro UAE.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local XAMPP Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
        errors:
          type: array
          items:
            type: string
        meta:
          type: object

    Product:
      type: object
      properties:
        id:
          type: integer
        uuid:
          type: string
        name:
          type: string
        default_rate:
          type: number
        stock_class:
          type: string
          enum: [retail, consumable, asset]
        is_active:
          type: boolean
        details:
          type: object

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      summary: Login to the local terminal
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized

  /master/products:
    get:
      summary: Get all master products
      parameters:
        - in: query
          name: active_only
          schema:
            type: boolean
          required: false
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      summary: Create a master product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /sales/orders:
    post:
      summary: Create Sales Order (Checkout)
      tags: [Sales]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                lines:
                  type: array
                  items:
                    type: object
                payments:
                  type: array
                  items:
                    type: object
      responses:
        '201':
          description: Order Created
          
  /inventory/stock/adjust:
    post:
      summary: Adjust Stock
      tags: [Inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id:
                  type: integer
                branch_id:
                  type: integer
                quantity_change:
                  type: number
                movement_type:
                  type: string
      responses:
        '201':
          description: Stock Adjusted

  /purchases/po:
    post:
      summary: Create Purchase Order
      tags: [Purchasing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vendor_id: { type: integer }
                lines: { type: array, items: { type: object } }
      responses:
        '201': { description: PO Created }

  /hr/employees:
    post:
      summary: Create Employee
      tags: [HR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: string }
                role_id: { type: integer }
                base_salary: { type: number }
      responses:
        '201': { description: Employee Created }

  /sync/push:
    post:
      summary: Push Sync Batch
      tags: [Sync]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                batch: { type: array, items: { type: object } }
      responses:
        '200': { description: Accepted }

  /install/status:
    get:
      summary: Check Installation Status
      tags: [Install]
      security: []
      responses:
        '200': { description: Status returned }

  /master/roles:
    get:
      summary: Get all RBAC roles
      tags: [Master]
      responses:
        '200': { description: Roles returned }

  /master/terminals:
    get:
      summary: List registered POS terminals
      tags: [Master]
      responses:
        '200': { description: Terminals returned }

  /customers:
    get:
      summary: List consumers
      tags: [Customers]
      parameters:
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200': { description: Customers returned }

  /expenses:
    post:
      summary: Log a petty cash expense
      tags: [Expenses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: number }
                category: { type: string }
                notes: { type: string }
      responses:
        '201': { description: Expense Logged }

  /delivery/challans:
    post:
      summary: Dispatch items to factory
      tags: [Delivery]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                driver_id: { type: integer }
                order_ids: { type: array, items: { type: integer } }
      responses:
        '201': { description: Challan Created }

  /analytics/dashboard:
    get:
      summary: Get daily metrics
      tags: [Analytics]
      responses:
        '200': { description: Dashboard metrics returned }

# --- FROM SWAGGER_CLOUD.yaml ---
openapi: 3.0.3
info:
  title: LaundryPro UAE - Cloud Portal API
  description: Central cloud micro-services API for multi-tenant Super-Admins and franchise sync ingestion.
  version: 1.0.0
servers:
  - url: https://api.cloud.laundrypro.ae/v1
    description: Production Cloud
  - url: http://localhost:8080/cloud
    description: Local Staging

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
        errors:
          type: array
          items:
            type: string

security:
  - bearerAuth: []

paths:
  /businesses/register:
    post:
      summary: Register New Local Node (Tenant)
      tags: [Ingestion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                trn: { type: string }
                email: { type: string }
                phone: { type: string }
      responses:
        '201':
          description: Tenant Registered Successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  admin_id: { type: integer }
                  tenant_token: { type: string }

  /sync/push:
    post:
      summary: Cloud Sync Ingestion (Local -> Cloud)
      tags: [Sync]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                batch: 
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Batch Synced Successfully (Returns Accepted/Rejected UUIDs)

  /sync/pull:
    get:
      summary: Cloud Sync Extraction (Cloud -> Local)
      tags: [Sync]
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
          required: true
          description: Last sync timestamp
      responses:
        '200':
          description: Returns changes since cursor

  /analytics/global-overview:
    get:
      summary: Super-Admin Global Dashboard
      tags: [Analytics]
      responses:
        '200':
          description: Global Multi-Tenant Metrics

  /auth/super-login:
    post:
      summary: Login to Cloud Portal
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: Success }

  /businesses/suspend:
    post:
      summary: Suspend a Tenant
      tags: [Tenants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                admin_id: { type: integer }
      responses:
        '200': { description: Tenant Suspended }

  /license/issue:
    post:
      summary: Issue License Key
      tags: [License]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                admin_id: { type: integer }
                expiry: { type: string }
      responses:
        '201': { description: License Generated }

  /reports/global-sales:
    get:
      summary: Cross-tenant Sales Report
      tags: [Reports]
      responses:
        '200': { description: Return aggregated data }
