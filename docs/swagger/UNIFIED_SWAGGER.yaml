openapi: 3.0.3
info:
  title: LaundryPro UAE — Unified API Specification
  version: 2.0.0
  description: "Complete unified specification for LaundryPro UAE enterprise system.\nIncludes both Local Workstation API endpoints (/local/api/v1/...) and Cloud Multi-Tenant Gateway endpoints (/cloud/api/v1/...)."
  contact:
    name: LaundryPro Architecture Team
    email: "dev@magnificentsolution.co.in"
  license:
    name: Proprietary
    url: "https://laundrypro.ae/license"
servers:
  - url: "http://127.0.0.1:8080"
    description: Local Workstation API
  - url: "https://api.cloud.laundrypro.ae/v1"
    description: "Cloud Central Multi-Tenant API"
  - url: "http://127.0.0.1:8081"
    description: Local Cloud Dev Server
tags:
  - name: Platform
    description: Health checks and telemetry endpoints
  - name: Identity
    description: Identity module endpoints
  - name: Configuration
    description: Configuration module endpoints
  - name: Install
    description: Install module endpoints
  - name: Customers
    description: Customers module endpoints
  - name: Vendors
    description: Vendors module endpoints
  - name: Catalog
    description: Catalog module endpoints
  - name: Sales
    description: Sales module endpoints
  - name: HR
    description: HR module endpoints
  - name: Expenses
    description: Expenses module endpoints
  - name: Delivery
    description: Delivery module endpoints
  - name: Challans
    description: Challans module endpoints
  - name: Purchasing
    description: Purchasing module endpoints
  - name: Notifications
    description: Notifications module endpoints
  - name: Reports
    description: "Cross-tenant aggregation and executive reporting"
  - name: Sync
    description: Outbox/Inbox delta synchronization pipeline
  - name: License
    description: "3-Way hardware handshake and license activation"
  - name: Inventory
    description: Inventory module endpoints
  - name: Backup
    description: Encrypted snapshot storage and disaster recovery
  - name: Branches
    description: Branches module endpoints
  - name: Terminals
    description: Terminals module endpoints
  - name: LAN
    description: LAN module endpoints
  - name: Analytics
    description: Analytics module endpoints
  - name: Localization
    description: Localization module endpoints
  - name: Channels
    description: Channels module endpoints
  - name: Accounting
    description: Accounting module endpoints
  - name: Storefront
    description: Storefront module endpoints
  - name: Portal
    description: Portal module endpoints
  - name: Advanced Cycles
    description: Advanced Cycles module endpoints
  - name: Sterilization
    description: Sterilization module endpoints
  - name: Equipment
    description: Equipment module endpoints
  - name: Operators
    description: Operators module endpoints
  - name: RFID
    description: RFID module endpoints
  - name: Tenants
    description: "Multi-tenant organization registration and onboarding"
  - name: SuperAdmin
    description: Central control plane operations
paths:
  /local/health:
    get:
      tags:
        - Platform
      summary: Health check
      operationId: get_health_index
      responses:
        200:
          description: HEALTH_OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"
        500:
          description: SERVER_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelope"
